
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:5173"
    command: npm run dev -- --host
    environment:
      - BACKEND_PROXY_URL=http://backend:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    command: npm run dev
    environment:
      - DISABLE_WORKER=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hellomyphotos
      - DB_PASS=hellomyphotos_secret
      - DB_NAME=hellomyphotos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IMMICH_ML_URL=http://machine-learning:3003
      - MEDIA_ROOT=/app/media
      - CACHE_ROOT=/app/cache
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw
      - ./backend:/app
      - /app/node_modules

  backend-worker:
    build:
      context: ./backend
    command: npm run dev
    environment:
      - DISABLE_API=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hellomyphotos
      - DB_PASS=hellomyphotos_secret
      - DB_NAME=hellomyphotos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IMMICH_ML_URL=http://machine-learning:3003
      - MEDIA_ROOT=/app/media
      - CACHE_ROOT=/app/cache
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw
      - ./backend:/app
      - /app/node_modules

  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=hellomyphotos
      - POSTGRES_PASSWORD=hellomyphotos_secret
      - POSTGRES_DB=hellomyphotos
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./volumes/pg_init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    volumes:
      - ./volumes/redis_data:/data
    ports:
      - "8003:6379"

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    environment:
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
    ports:
      - "8004:3003"
    volumes:
      - ./volumes/ml_cache:/cache
