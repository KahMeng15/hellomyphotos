services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:5173"
    command: npm run dev -- --host
    env_file: .env
    environment:
      - BACKEND_PROXY_URL=http://backend:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    command: npm run dev
    env_file: .env
    environment:
      - DISABLE_WORKER=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw
      - ./backend:/app
      - /app/node_modules

  backend-worker:
    build:
      context: ./backend
    command: npm run dev
    env_file: .env
    environment:
      - DISABLE_API=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw
      - ./backend:/app
      - /app/node_modules

  postgres:
    image: ankane/pgvector:v0.5.1
    env_file: .env
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./volumes/pg_init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    env_file: .env
    volumes:
      - ./volumes/redis_data:/data
    ports:
      - "8003:6379"

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    env_file: .env
    ports:
      - "8004:3003"
    volumes:
      - ./volumes/ml_cache:/cache
