services:
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:5173"
    command: npm run dev -- --host
    env_file: .env
    environment:
      - BACKEND_PROXY_URL=http://backend:3000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npm run dev
    env_file: .env
    environment:
      - DISABLE_WORKER=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npm run dev
    env_file: .env
    environment:
      - DISABLE_API=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw
      - ./backend:/app
      - /app/node_modules

  postgres:
    restart: unless-stopped
    image: ankane/pgvector:v0.5.1
    env_file: .env
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./volumes/pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    env_file: .env
    volumes:
      - ./volumes/redis_data:/data
    ports:
      - "8003:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  machine-learning:
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-machine-learning:release
    env_file: .env
    ports:
      - "8004:3003"
    volumes:
      - ./volumes/ml_cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/ping > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
