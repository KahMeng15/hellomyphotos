services:
  frontend:
    restart: unless-stopped
    image: ghcr.io/kahmeng15/hellomyphotos/frontend:latest
    build:
      context: ./frontend
    ports:
      - "8000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - BACKEND_PROXY_URL=http://backend:3000
    depends_on:
      - backend

  backend:
    restart: unless-stopped
    image: ghcr.io/kahmeng15/hellomyphotos/backend:latest
    build:
      context: ./backend
    env_file: .env
    environment:
      - DISABLE_WORKER=true
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw

  backend-worker:
    restart: unless-stopped
    image: ghcr.io/kahmeng15/hellomyphotos/backend:latest
    build:
      context: ./backend
    env_file: .env
    environment:
      - DISABLE_API=true
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw

  postgres:
    restart: unless-stopped
    image: ankane/pgvector:v0.5.1
    env_file: .env
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./volumes/pg_init:/docker-entrypoint-initdb.d

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    env_file: .env
    volumes:
      - ./volumes/redis_data:/data
    ports:
      - "8003:6379"

  machine-learning:
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-machine-learning:release
    env_file: .env
    ports:
      - "8004:3003"
    volumes:
      - ./volumes/ml_cache:/cache
