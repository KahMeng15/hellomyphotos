services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:3000"
    environment:
      - PUBLIC_APP_DOMAIN=${PUBLIC_APP_DOMAIN:-http://localhost:8000}
      - PUBLIC_TURNSTILE_SITEKEY=${PUBLIC_TURNSTILE_SITEKEY:-1x00000000000000000000AA}
      - NODE_ENV=production
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-http://localhost:8000}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}
      - DISABLE_WORKER=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hellomyphotos
      - DB_PASS=hellomyphotos_secret
      - DB_NAME=hellomyphotos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IMMICH_ML_URL=http://machine-learning:3003
      - MEDIA_ROOT=/app/media
      - CACHE_ROOT=/app/cache
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw

  backend-worker:
    build:
      context: ./backend
    environment:
      - DISABLE_API=true
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hellomyphotos
      - DB_PASS=hellomyphotos_secret
      - DB_NAME=hellomyphotos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IMMICH_ML_URL=http://machine-learning:3003
      - MEDIA_ROOT=/app/media
      - CACHE_ROOT=/app/cache
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./volumes/media_ro:/app/media:ro
      - ./volumes/cache_rw:/app/cache:rw

  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=hellomyphotos
      - POSTGRES_PASSWORD=hellomyphotos_secret
      - POSTGRES_DB=hellomyphotos
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./volumes/pg_init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    volumes:
      - ./volumes/redis_data:/data
    ports:
      - "8003:6379"

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    environment:
      - MACHINE_LEARNING_WORKERS=1
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
    ports:
      - "8004:3003"
    volumes:
      - ./volumes/ml_cache:/cache
