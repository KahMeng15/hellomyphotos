name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: |
          output=$(npx tsc --noEmit 2>&1 || true)
          filtered=$(printf '%s\n' "$output" | grep -vE "queue/index.ts|test_pipeline.ts|throttle.ts" || true)
          if [ -n "$filtered" ]; then
            printf '%s\n' "$filtered"
            exit 1
          fi

  backend-e2e:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: hellomyphotos
          POSTGRES_PASSWORD: hellomyphotos_secret
          POSTGRES_DB: hellomyphotos
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/volumes/pg_init:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd "pg_isready -U hellomyphotos -d hellomyphotos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: hellomyphotos
      DB_PASS: hellomyphotos_secret
      DB_NAME: hellomyphotos
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MEDIA_ROOT: /tmp/e2e/media
      CACHE_ROOT: /tmp/e2e/cache
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Prepare media/cache dirs
        run: mkdir -p "$MEDIA_ROOT" "$CACHE_ROOT"
      - name: Run E2E test suite
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_TURNSTILE_SITEKEY: test
      VITE_API_URL: http://localhost:3000
      PUBLIC_APP_DOMAIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: svelte-check
        run: npm run check
        continue-on-error: true
      - name: Build
        run: npm run build
